<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Team Chat</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1d2125;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .chat-wrap {
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .msg {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .avatar {
        width: 32px;
        height: 32px;
        min-width: 32px;
        border-radius: 50%;
        background: #579dff;
        color: #09326c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
      }

      .msg-body {
        flex: 1;
        min-width: 0;
      }

      .msg-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 4px;
      }

      .msg-name {
        font-weight: 600;
        font-size: 13px;
        color: #dcdfe4;
      }

      .msg-time {
        font-size: 11px;
        color: #8c9bab;
      }

      .msg-text {
        display: inline-block;
        font-size: 13px;
        color: #b6c2cf;
        background: #282e33;
        border: 1px solid #38414a;
        border-radius: 8px;
        padding: 8px 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .delete-btn {
        width: 28px;
        height: 28px;
        min-width: 28px;
        border-radius: 6px;
        background: #2c333a;
        border: 1px solid #3d444b;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.12s ease,
          background 0.12s ease;
        align-self: center;
      }

      .msg:hover .delete-btn.is-own {
        opacity: 1;
        visibility: visible;
      }

      .delete-btn:hover {
        background: #3d444b;
      }

      .delete-btn svg {
        width: 14px;
        height: 14px;
        stroke: #b6c2cf;
      }

      .delete-btn:disabled {
        opacity: 0.5 !important;
        cursor: default;
      }

      .empty-state,
      .status-line {
        margin: auto;
        text-align: center;
        color: #8c9bab;
        font-size: 13px;
      }

      .input-row {
        display: flex;
        gap: 8px;
        padding: 10px;
        background: #22272b;
        border-top: 1px solid #3d444b;
        box-sizing: border-box;
      }

      .input-row input {
        flex: 1;
        background: #1d2125;
        border: 1px solid #3d444b;
        border-radius: 6px;
        padding: 9px 10px;
        color: #dcdfe4;
        font-size: 13px;
        outline: none;
        min-width: 0;
      }

      .input-row input::placeholder {
        color: #738496;
      }

      .input-row input:focus {
        border-color: #579dff;
      }

      .input-row button.send-btn {
        background: #579dff;
        color: #09326c;
        border: none;
        border-radius: 6px;
        padding: 0 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .input-row button.send-btn:hover:not(:disabled) {
        background: #85b8ff;
      }

      .input-row button.send-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="chat-wrap">
      <div class="messages" id="messages">
        <div class="status-line" id="status-line">Loading messages…</div>
      </div>
      <div class="input-row">
        <input
          type="text"
          id="msg-input"
          placeholder="Type your message here..."
          maxlength="500"
        />
        <button class="send-btn" id="send-btn" type="button">Send</button>
      </div>
    </div>

    <script>
      var t = window.TrelloPowerUp.iframe();

      // ---------------------------------------------------------------
      // Storage strategy: no database. Messages live in Trello's own
      // Power-Up data store, at board scope / shared visibility, so
      // every member on the board can read and write them via
      // t.get('board', 'shared', 'messages') / t.set(...).
      //
      // Trello caps board+shared storage at 8192 characters TOTAL for
      // this key. We keep a safety margin and drop the oldest messages
      // once we get close, so the chat behaves like a rolling window of
      // recent messages rather than an unbounded log.
      // ---------------------------------------------------------------
      var STORAGE_KEY = "messages";
      var MAX_STORED_CHARS = 7800; // stay under Trello's 8192 cap with margin
      var POLL_INTERVAL_MS = 3000;

      var TRASH_ICON =
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="3 6 5 6 21 6"></polyline>' +
        '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>' +
        '<path d="M10 11v6"></path><path d="M14 11v6"></path>' +
        '<path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>' +
        "</svg>";

      var messagesEl = document.getElementById("messages");
      var statusLine = document.getElementById("status-line");
      var input = document.getElementById("msg-input");
      var sendBtn = document.getElementById("send-btn");

      var currentMember = { id: "me", name: "You", initials: "Y" };
      var lastRenderedSignature = "";

      function initials(name) {
        return (name || "?")
          .split(" ")
          .filter(Boolean)
          .slice(0, 2)
          .map(function (part) {
            return part[0].toUpperCase();
          })
          .join("");
      }

      function timeAgo(ts) {
        var diff = Math.max(0, Date.now() - ts);
        var mins = Math.floor(diff / 60000);
        if (mins < 1) return "a few seconds ago";
        if (mins === 1) return "1 minute ago";
        if (mins < 60) return mins + " minutes ago";
        var hours = Math.floor(mins / 60);
        if (hours === 1) return "1 hour ago";
        if (hours < 24) return hours + " hours ago";
        var days = Math.floor(hours / 24);
        return days === 1 ? "1 day ago" : days + " days ago";
      }

      function renderMessages(list) {
        var signature = list
          .map(function (m) {
            return m.id;
          })
          .join(",");
        if (signature === lastRenderedSignature) {
          var timeEls = messagesEl.querySelectorAll("[data-ts]");
          timeEls.forEach(function (el) {
            el.textContent = timeAgo(Number(el.getAttribute("data-ts")));
          });
          return;
        }
        lastRenderedSignature = signature;

        messagesEl.innerHTML = "";

        if (!list.length) {
          var empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "No messages yet. Say hi 👋";
          messagesEl.appendChild(empty);
          return;
        }

        list.forEach(function (m) {
          var own = isOwnMessage(m);

          var msg = document.createElement("div");
          msg.className = "msg";

          var avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = initials(m.name);

          var body = document.createElement("div");
          body.className = "msg-body";

          var header = document.createElement("div");
          header.className = "msg-header";

          var nameEl = document.createElement("span");
          nameEl.className = "msg-name";
          nameEl.textContent = m.name;

          var timeEl = document.createElement("span");
          timeEl.className = "msg-time";
          timeEl.setAttribute("data-ts", m.ts);
          timeEl.textContent = timeAgo(m.ts);

          header.appendChild(nameEl);
          header.appendChild(timeEl);

          var textEl = document.createElement("div");
          textEl.className = "msg-text";
          textEl.textContent = m.text;

          body.appendChild(header);
          body.appendChild(textEl);

          msg.appendChild(avatar);
          msg.appendChild(body);

          // Delete button — only wired up (and only ever visible via CSS
          // hover) for messages the current member authored.
          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "delete-btn" + (own ? " is-own" : "");
          deleteBtn.innerHTML = TRASH_ICON;
          deleteBtn.title = "Delete message";
          deleteBtn.setAttribute("aria-label", "Delete message");
          if (own) {
            deleteBtn.addEventListener("click", function () {
              deleteMessage(m.id, deleteBtn);
            });
          } else {
            deleteBtn.disabled = true;
            deleteBtn.tabIndex = -1;
          }
          msg.appendChild(deleteBtn);

          messagesEl.appendChild(msg);
        });

        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function refresh() {
        loadMessages()
          .then(function (list) {
            renderMessages(list || []);
          })
          .catch(function () {
            statusLine.textContent = "Could not load messages.";
          });
      }

      function sendMessage() {
        var text = input.value.trim();
        if (!text) return;

        sendBtn.disabled = true;

        loadMessages()
          .then(function (list) {
            list = list || [];
            list.push({
              id: currentMember.id + "-" + Date.now(),
              memberId: currentMember.id,
              name: currentMember.name,
              text: text,
              ts: Date.now(),
            });
            list = trimToFit(list);
            return t
              .set("board", "shared", STORAGE_KEY, list)
              .then(function () {
                return list;
              });
          })
          .then(function (list) {
            lastRenderedSignature = ""; // force re-render even if trimming kept the id set identical
            renderMessages(list);
            input.value = "";
          })
          .catch(function () {
            statusLine.textContent = "Message failed to send.";
          })
          .finally(function () {
            sendBtn.disabled = false;
            input.focus();
          });
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendMessage();
      });

      t.member("all")
        .then(function (member) {
          if (member) {
            currentMember = {
              id: member.id,
              name: member.fullName || "Member",
              initials: member.initials || initials(member.fullName),
            };
          }
          refresh();
        })
        .catch(function () {
          refresh();
        });

      setInterval(refresh, POLL_INTERVAL_MS);
    </script>
  </body>
</html>
